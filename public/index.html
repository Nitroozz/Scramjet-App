<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>ADOBE INFINITE</title>

		<link rel="shortcut icon" content="favicon.webp" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #111;
			}

			body {
				display: grid;
				place-items: center;
				font-family: Arial, sans-serif;
			}

			#home {
				display: flex;
				gap: 16px;
				flex-wrap: wrap;
				justify-content: center;
			}

			button {
				min-width: 180px;
				padding: 16px 24px;
				border: 0;
				border-radius: 6px;
				background: #2d7ff9;
				color: #fff;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
			}

			button:hover {
				background: #1769df;
			}

			#sj-frame {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				border: 0;
			}
		</style>
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<main id="home">
			<button id="duckduckgo" type="button">DuckDuckGo</button>
			<button id="geforce-now" type="button">GeForce NOW</button>
		</main>
		<form id="sj-form" hidden>
			<input id="sj-search-engine" value="%s" type="hidden" />
			<input id="sj-address" type="hidden" />
		</form>
		<p id="sj-error" hidden></p>
		<pre id="sj-error-code" hidden></pre>
	</body>
</html>
